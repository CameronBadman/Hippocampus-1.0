[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hippocampus-graph"
version = "1.0.0"
description = "Differentiable packed graph storage and manifold working layouts for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=2", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
sre = ["safetensors>=0.4", "transformers>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["src/hippocampus"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA-capable test process",
]
